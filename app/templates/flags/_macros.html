{% macro env_badge(env) -%}
<span class="badge {{ {'prod': 'badge-red', 'staging': 'badge-amber'}.get(env, 'badge-gray') }}">{{ env }}</span>
{%- endmacro %}

{% macro state_badge(flag) -%}
{% if flag.enabled %}<span class="badge badge-green">ON</span>{% else %}<span class="badge badge-gray">OFF</span>{% endif %}
{%- endmacro %}

{% macro rollout_bar(pct) -%}
<span style="display:inline-flex;align-items:center;gap:.5rem;">
  <span style="display:inline-block;width:80px;height:6px;border-radius:3px;background:#e5e7eb;overflow:hidden;">
    <span style="display:block;height:100%;width:{{ pct }}%;background:#2563eb;"></span>
  </span>
  <span>{{ pct }}%</span>
</span>
{%- endmacro %}
